[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torproxy"
version = "2.0.0"
description = "A desktop HTTP proxy front-end for a locally managed Tor process"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Nima Salamat"}]
dependencies = [
  "PySide6>=6.5,<7",
  "QDarkStyle>=3.2,<4",
  "stem>=1.8.2,<2",
  "PySocks>=1.7.1,<2",
  "opencv-python>=4.8,<5",
  "numpy>=1.24,<3",
  "pyzbar>=0.1.9,<1",
  "keyboard>=0.13,<1",
  "psutil>=5.9,<8",
  "portalocker>=2.8,<4",
  "beautifulsoup4>=4.12,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = ".", "torproxy" = "src/torproxy"}
packages = ["torproxy", "ui_", "ui_.btn", "ui_.emojis", "ui_.window", "ui_.worker"]
py-modules = ["main", "ui", "config", "proxy", "tor", "set_proxy", "updater", "utils", "whatismyip"]
include-package-data = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in tests that contact the official Tor distribution and verify real bundle signatures"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
