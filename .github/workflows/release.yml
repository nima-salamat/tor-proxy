name: Build and release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: torproxy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: windows
            archive: TorProxy-windows-x64.zip
          - os: ubuntu-22.04
            label: Linux x64
            target: linux
            archive: TorProxy-linux-x64.tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application, tests, and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,package]"

      - name: Lint and run the offline test suite
        run: |
          ruff check src/torproxy tests scripts --select E,F,UP --ignore E501
          pytest --cov=torproxy.host_rules --cov=torproxy.ip_check --cov-report=term-missing --cov-fail-under=75

      - name: Build one-directory application
        run: python -m PyInstaller --noconfirm --clean packaging/torproxy.spec

      - name: Smoke-test frozen Windows app
        if: runner.os == 'Windows'
        run: python scripts/package_smoke_test.py dist/TorProxy/TorProxy.exe

      - name: Smoke-test frozen Linux app
        if: runner.os == 'Linux'
        run: python scripts/package_smoke_test.py dist/TorProxy/TorProxy

      - name: Create Windows portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/TorProxy" -DestinationPath "TorProxy-windows-x64.zip" -CompressionLevel Optimal -Force
          Get-Item "TorProxy-windows-x64.zip" | Select-Object Name, Length

      - name: Create Linux portable archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -cf - -C dist TorProxy | gzip -9 > TorProxy-linux-x64.tar.gz
          ls -lh TorProxy-linux-x64.tar.gz

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: torproxy-package-${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows and Linux archives
        uses: actions/download-artifact@v4
        with:
          pattern: torproxy-package-*
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          sha256sum TorProxy-windows-x64.zip TorProxy-linux-x64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TorProxy-windows-x64.zip
            TorProxy-linux-x64.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
